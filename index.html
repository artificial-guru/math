<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mattematchen</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-green: #2d8a4e;
    --pitch-dark: #1a5c32;
    --pitch-light: #3aad62;
    --gold: #ffd700;
    --gold-dark: #c5a200;
    --white: #ffffff;
    --dark: #1a1a2e;
    --red: #e74c3c;
    --blue: #2980b9;
    --cell-size: 44px;
    --cell-font: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', sans-serif; background: var(--pitch-dark);
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  }
  .pitch-bg {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, var(--pitch-green) 0px, var(--pitch-green) 40px, var(--pitch-light) 40px, var(--pitch-light) 80px);
    z-index: 0;
  }
  .pitch-bg::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 200px; height: 200px;
    border-radius: 50%; border: 4px solid rgba(255,255,255,0.15);
  }
  .pitch-bg::after {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); width: 4px; height: 100%;
    background: rgba(255,255,255,0.1);
  }
  .app-container {
    position: relative; z-index: 1; max-width: 700px;
    margin: 0 auto; padding: 10px 12px 16px;
  }
  .header { text-align: center; margin-bottom: 8px; }
  .header h1 {
    font-family: 'Bangers', cursive; font-size: 2.2rem; color: var(--white);
    text-shadow: 3px 3px 0 var(--dark), 0 0 20px rgba(255,215,0,0.4);
    letter-spacing: 3px; line-height: 1;
  }
  .header h1 span { color: var(--gold); }
  .header .subtitle { font-size: 0.8rem; color: rgba(255,255,255,0.8); font-weight: 700; margin-top: 2px; }

  /* ─── Start Menu ─── */
  .menu-card {
    background: var(--white); border-radius: 16px; padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 3px solid var(--gold);
    text-align: center; max-width: 380px; margin: 20px auto 0;
  }
  .menu-card h2 {
    font-family: 'Bangers', cursive; font-size: 1.6rem; color: var(--dark);
    letter-spacing: 1px; margin-bottom: 16px;
  }
  .mode-btn {
    display: block; width: 100%; font-family: 'Bangers', cursive;
    font-size: 1.3rem; padding: 14px 20px; border: 3px solid var(--gold);
    border-radius: 14px; cursor: pointer; transition: all 0.2s;
    letter-spacing: 1px; margin-bottom: 10px; background: var(--white); color: var(--dark);
  }
  .mode-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  .mode-btn.selected { background: var(--gold); color: var(--dark); border-color: var(--gold-dark); }
  .mode-btn .mode-desc {
    font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 700;
    color: #666; display: block; margin-top: 2px;
  }
  .mode-btn.selected .mode-desc { color: #5d4e00; }

  .timer-picker {
    margin: 16px 0; display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .timer-picker label {
    font-family: 'Bangers', cursive; font-size: 1.1rem; color: var(--dark); letter-spacing: 1px;
  }
  .timer-picker select {
    font-family: 'Nunito', sans-serif; font-size: 1.1rem; font-weight: 800;
    padding: 6px 12px; border-radius: 8px; border: 2px solid var(--gold);
    background: #fff; color: var(--dark); cursor: pointer; outline: none;
  }

  .btn-start {
    font-family: 'Bangers', cursive; font-size: 1.4rem; padding: 14px 40px;
    border: none; border-radius: 50px; cursor: pointer;
    background: var(--pitch-green); color: var(--white);
    box-shadow: 0 4px 16px rgba(45,138,78,0.5); letter-spacing: 2px;
    transition: all 0.2s; margin-top: 8px;
  }
  .btn-start:hover { transform: translateY(-2px); }

  /* ─── Scoreboard ─── */
  .scoreboard {
    display: flex; justify-content: center; align-items: center; gap: 14px;
    margin-bottom: 8px; background: var(--dark); border-radius: 10px;
    padding: 8px 14px; border: 2px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .score-item { text-align: center; }
  .score-label {
    font-size: 0.55rem; color: rgba(255,255,255,0.6);
    text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;
  }
  .score-value { font-family: 'Bangers', cursive; font-size: 1.5rem; color: var(--gold); line-height: 1.1; }
  .score-value.streak { color: #ff6b6b; }
  .score-value.timer-val {
    color: var(--white); font-variant-numeric: tabular-nums; font-size: 1.3rem;
  }
  .score-value.timer-val.urgent { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .score-divider { width: 1px; height: 30px; background: rgba(255,255,255,0.15); }

  .goal-progress { display: flex; align-items: center; gap: 3px; }
  .goal-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .goal-dot.scored { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px rgba(255,215,0,0.5); }

  /* ─── Op selector ─── */
  .op-selector { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .op-btn {
    font-family: 'Bangers', cursive; font-size: 1.05rem; padding: 6px 16px;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 50px;
    background: rgba(0,0,0,0.3); color: var(--white); cursor: pointer;
    transition: all 0.2s; letter-spacing: 1px; white-space: nowrap;
  }
  .op-btn:hover { transform: translateY(-2px); border-color: var(--gold); }
  .op-btn.active {
    background: var(--gold); color: var(--dark); border-color: var(--gold);
    box-shadow: 0 0 15px rgba(255,215,0,0.4);
  }

  /* ─── Problem card ─── */
  .problem-card {
    background: var(--white); border-radius: 14px; padding: 16px 14px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 2px solid var(--gold);
    position: relative; overflow: hidden;
  }
  .problem-card::before {
    content: '⚽'; position: absolute; top: -8px; right: -8px;
    font-size: 3.5rem; opacity: 0.08;
  }
  .problem-question {
    font-family: 'Bangers', cursive; font-size: 1.15rem; color: var(--dark);
    text-align: center; margin-bottom: 10px; letter-spacing: 1px;
  }
  .workspace { display: flex; flex-direction: column; align-items: center; gap: 0; position: relative; }
  .grid-row { display: flex; align-items: center; gap: 0; position: relative; }
  .op-symbol {
    width: var(--cell-size); height: var(--cell-size); display: flex;
    align-items: center; justify-content: center;
    font-family: 'Bangers', cursive; font-size: 1.5rem; color: var(--pitch-dark);
  }
  .cell {
    width: var(--cell-size); height: var(--cell-size); display: flex;
    align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif; font-size: var(--cell-font);
    font-weight: 900; color: var(--dark); position: relative;
  }
  .cell-digit { background: transparent; }
  .cell-input {
    width: var(--cell-size); height: var(--cell-size);
    border: 2px solid #ccc; border-radius: 8px; text-align: center;
    font-family: 'Nunito', sans-serif; font-size: var(--cell-font);
    font-weight: 900; color: var(--dark); background: #f9f9f9;
    outline: none; transition: all 0.2s; padding: 0;
  }
  .cell-input:focus { border-color: var(--pitch-green); box-shadow: 0 0 0 3px rgba(45,138,78,0.2); background: #fff; }
  .cell-input.correct { border-color: var(--pitch-green); background: #e8f5e9; color: var(--pitch-dark); }
  .cell-input.incorrect { border-color: var(--red); background: #ffeaea; color: var(--red); animation: shake 0.4s; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  .carry-row { display: flex; gap: 0; }
  .carry-cell { width: var(--cell-size); height: 24px; display: flex; align-items: center; justify-content: center; }
  .carry-input {
    width: 24px; height: 22px; border: 1.5px dashed #bbb; border-radius: 5px;
    text-align: center; font-family: 'Nunito', sans-serif; font-size: 13px;
    font-weight: 800; color: var(--red); background: #fff8f0;
    outline: none; padding: 0; transition: all 0.2s;
  }
  .carry-input:focus { border-color: var(--red); background: #fff; box-shadow: 0 0 0 2px rgba(231,76,60,0.15); }
  .carry-input.has-value { border-style: solid; background: #fff0e0; }

  .separator { width: 100%; display: flex; justify-content: center; }
  .sep-line { height: 3px; background: var(--dark); border-radius: 2px; }

  .btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    font-family: 'Bangers', cursive; font-size: 1.05rem; padding: 8px 20px;
    border: none; border-radius: 50px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn-check { background: var(--pitch-green); color: var(--white); box-shadow: 0 4px 12px rgba(45,138,78,0.4); }
  .btn-new { background: var(--gold); color: var(--dark); box-shadow: 0 4px 12px rgba(255,215,0,0.4); }
  .btn-hint { background: var(--blue); color: var(--white); box-shadow: 0 4px 12px rgba(41,128,185,0.4); font-size: 0.95rem; padding: 7px 16px; }
  .btn-undo { background: #8e44ad; color: var(--white); box-shadow: 0 4px 12px rgba(142,68,173,0.4); font-size: 0.95rem; padding: 7px 16px; }

  .feedback {
    text-align: center; margin-top: 10px; font-family: 'Bangers', cursive;
    font-size: 1.3rem; letter-spacing: 2px; min-height: 36px;
  }
  .feedback.goal { color: var(--pitch-green); animation: goalCelebrate 0.6s ease-out; }
  .feedback.miss { color: var(--red); animation: shake 0.4s; }
  @keyframes goalCelebrate { 0%{transform:scale(0.5);opacity:0} 50%{transform:scale(1.3)} 100%{transform:scale(1);opacity:1} }

  .goal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.3s;
  }
  .goal-overlay.show { opacity: 1; }
  .goal-text {
    font-family: 'Bangers', cursive; font-size: 5rem; color: var(--gold);
    text-shadow: 4px 4px 0 var(--dark), 0 0 40px rgba(255,215,0,0.6);
    animation: goalZoom 1s ease-out;
  }
  @keyframes goalZoom { 0%{transform:scale(0) rotate(-10deg);opacity:0} 60%{transform:scale(1.2) rotate(5deg);opacity:1} 100%{transform:scale(1) rotate(0deg);opacity:1} }

  .ball-rain {
    position: fixed; top: -60px; font-size: 2rem;
    animation: fallDown 2s ease-in forwards; z-index: 99; pointer-events: none;
  }
  @keyframes fallDown { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

  .hint-box {
    background: #fff8e1; border: 2px solid var(--gold-dark); border-radius: 10px;
    padding: 10px 12px; margin-top: 10px; font-size: 0.8rem;
    color: #5d4e00; font-weight: 700; line-height: 1.4;
  }
  .hint-box .hint-title {
    font-family: 'Bangers', cursive; font-size: 0.95rem;
    color: var(--gold-dark); margin-bottom: 2px; letter-spacing: 1px;
  }

  /* Borrow */
  .borrow-digit-cell {
    width: var(--cell-size); height: var(--cell-size);
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; user-select: none; transition: transform 0.1s;
  }
  .borrow-digit-cell:hover { transform: scale(1.08); }
  .borrow-digit-cell.no-click { cursor: default; }
  .borrow-digit-cell.no-click:hover { transform: none; }
  .borrow-digit-main {
    font-family: 'Nunito', sans-serif; font-size: var(--cell-font);
    font-weight: 900; color: var(--dark); position: relative; z-index: 1;
  }
  .borrow-digit-main.crossed-out { color: var(--red); opacity: 0.55; }
  .borrow-digit-main.crossed-out::after {
    content: ''; position: absolute; top: 50%; left: -3px; right: -3px;
    height: 2.5px; background: var(--red); transform: rotate(-18deg);
  }
  .borrow-ten-marker {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 900;
    color: var(--red); z-index: 3; line-height: 1; white-space: nowrap;
  }
  .borrow-help-text { font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 4px; font-weight: 700; }

  /* Square root visual */
  .sqrt-display {
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px; gap: 0;
  }
  .sqrt-symbol {
    font-size: 3.2rem; font-weight: 400; color: var(--dark);
    line-height: 1; display: flex; align-items: flex-end;
    position: relative; padding-right: 2px;
  }
  .sqrt-radicand-wrap {
    position: relative; display: inline-flex; align-items: center;
    padding: 4px 10px 4px 4px;
  }
  .sqrt-radicand-wrap::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--dark); border-radius: 1px;
  }
  .sqrt-radicand {
    font-family: 'Bangers', cursive; font-size: 2.4rem;
    color: var(--dark); letter-spacing: 2px; line-height: 1.1;
  }
  .sqrt-equals { font-family: 'Bangers', cursive; font-size: 2rem; color: var(--dark); margin: 0 10px; }
  .sqrt-input {
    width: 64px; height: 56px; border: 3px solid #ccc; border-radius: 12px;
    text-align: center; font-family: 'Bangers', cursive; font-size: 2rem;
    color: var(--dark); background: #f9f9f9; outline: none;
    transition: all 0.2s; padding: 0;
  }
  .sqrt-input:focus { border-color: var(--pitch-green); box-shadow: 0 0 0 4px rgba(45,138,78,0.2); background: #fff; }
  .sqrt-input.correct { border-color: var(--pitch-green); background: #e8f5e9; color: var(--pitch-dark); }
  .sqrt-input.incorrect { border-color: var(--red); background: #ffeaea; color: var(--red); animation: shake 0.4s; }

  /* Finished overlay */
  .match-finished-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75); display: flex; align-items: center;
    justify-content: center; z-index: 200; backdrop-filter: blur(4px);
  }
  .match-finished-card {
    background: var(--white); border-radius: 20px; padding: 28px 24px;
    text-align: center; border: 4px solid var(--gold);
    box-shadow: 0 12px 48px rgba(0,0,0,0.5); max-width: 340px; width: 90%;
    animation: goalZoom 0.6s ease-out;
  }
  .match-finished-card h2 {
    font-family: 'Bangers', cursive; font-size: 2rem; color: var(--pitch-dark);
    letter-spacing: 2px; margin-bottom: 6px;
  }
  .match-finished-card .trophy { font-size: 3rem; margin-bottom: 6px; }
  .match-finished-card .stats {
    font-size: 0.95rem; font-weight: 800; color: var(--dark);
    margin-bottom: 14px; line-height: 1.8;
  }
  .match-finished-card .stats span { color: var(--gold-dark); font-family: 'Bangers', cursive; font-size: 1.2rem; }
  .btn-restart {
    font-family: 'Bangers', cursive; font-size: 1.2rem; padding: 12px 32px;
    border: none; border-radius: 50px; cursor: pointer;
    background: var(--pitch-green); color: var(--white);
    box-shadow: 0 4px 16px rgba(45,138,78,0.5); letter-spacing: 1px;
    transition: all 0.2s; margin: 4px;
  }
  .btn-restart:hover { transform: translateY(-2px); }
  .btn-menu {
    font-family: 'Bangers', cursive; font-size: 1rem; padding: 10px 24px;
    border: 2px solid #ccc; border-radius: 50px; cursor: pointer;
    background: var(--white); color: var(--dark);
    letter-spacing: 1px; transition: all 0.2s; margin: 4px;
  }
  .btn-menu:hover { transform: translateY(-2px); border-color: var(--gold); }

  @media (max-width: 500px) {
    :root { --cell-size: 38px; --cell-font: 20px; }
    .header h1 { font-size: 1.8rem; }
    .carry-input { width: 20px; height: 18px; font-size: 11px; }
    .goal-text { font-size: 3.5rem; }
    .scoreboard { gap: 10px; padding: 7px 10px; }
    .score-value { font-size: 1.3rem; }
    .score-value.timer-val { font-size: 1.1rem; }
    .goal-dot { width: 10px; height: 10px; }
    .op-selector { gap: 4px; }
    .op-btn { font-size: 0.85rem; padding: 5px 9px; letter-spacing: 0.5px; }
    .problem-card { padding: 12px 10px 10px; }
    .problem-question { font-size: 1.05rem; margin-bottom: 8px; }
    .btn { font-size: 0.95rem; padding: 7px 16px; }
    .borrow-ten-marker { font-size: 10px; }
    .menu-card { padding: 22px 18px; margin-top: 14px; }
    .menu-card h2 { font-size: 1.4rem; }
    .mode-btn { font-size: 1.1rem; padding: 12px 16px; }
    .btn-start { font-size: 1.2rem; padding: 12px 32px; }
    .sqrt-symbol { font-size: 2.6rem; }
    .sqrt-radicand { font-size: 2rem; }
    .sqrt-equals { font-size: 1.6rem; margin: 0 8px; }
    .sqrt-input { width: 54px; height: 48px; font-size: 1.7rem; }
  }
</style>
</head>
<body>

<div class="pitch-bg"></div>
<div class="app-container" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const MATCH_GOALS = 10;

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

function generateProblem(op) {
  let a, b;
  // 70% chance hundreds (100-999), 30% chance thousands (1000-9999)
  const pick = () => Math.random() < 0.7 ? randInt(100,999) : randInt(1000,9999);
  if (op === '+') { a = pick(); b = pick(); return {a,b,op,answer:a+b}; }
  else if (op === '\u2212') { a = pick(); b = randInt(100, a); return {a,b,op,answer:a-b}; }
  else if (op === '\u00d7') { a = randInt(12,999); b = randInt(12,99); return {a,b,op,answer:a*b}; }
  else { /* √ */ b = randInt(1,10); a = b * b; return {a,b:null,op,answer:b}; }
}

function digitsArr(n, len) {
  const arr = String(n).split('').map(Number);
  while (arr.length < len) arr.unshift(null);
  return arr;
}

function fmtTimer(sec) {
  const m = Math.floor(sec / 60); const s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ─── Sound effects (Web Audio API) ──────────────────────
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playGoalSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // Rising triumphant chord: C5, E5, G5 staggered
    const freqs = [523, 659, 784];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.6);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.7);
    });

    // Crowd noise burst (white noise through bandpass)
    const bufferSize = ctx.sampleRate * 0.8;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 1200;
    bandpass.Q.value = 0.5;
    const nGain = ctx.createGain();
    nGain.gain.setValueAtTime(0, now);
    nGain.gain.linearRampToValueAtTime(0.12, now + 0.05);
    nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
    noise.connect(bandpass); bandpass.connect(nGain); nGain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.9);
  } catch(e) {}
}

function playWhistleSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // Three short whistle blasts like a referee
    [0, 0.25, 0.5].forEach((offset) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(3200, now + offset);
      osc.frequency.linearRampToValueAtTime(2800, now + offset + 0.15);
      gain.gain.setValueAtTime(0, now + offset);
      gain.gain.linearRampToValueAtTime(0.15, now + offset + 0.02);
      gain.gain.setValueAtTime(0.15, now + offset + 0.1);
      gain.gain.linearRampToValueAtTime(0, now + offset + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.2);
    });
  } catch(e) {}
}

function playMissSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    // Short descending tone
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.linearRampToValueAtTime(200, now + 0.25);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.35);
  } catch(e) {}
}

// ─── Main App ───────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('menu'); // menu | playing | finished
  const [mode, setMode] = useState('match');    // match | practice
  const [practiceMins, setPracticeMins] = useState(5);
  const [timeLeft, setTimeLeft] = useState(0);

  const [operation, setOperation] = useState('+');
  const [problem, setProblem] = useState(() => generateProblem('+'));
  const [score, setScore] = useState(0);
  const [streak, setStreak] = useState(0);
  const [bestStreak, setBestStreak] = useState(0);
  const [attempts, setAttempts] = useState(0);
  const [feedback, setFeedback] = useState('');
  const [feedbackType, setFeedbackType] = useState('');
  const [showGoal, setShowGoal] = useState(false);
  const [balls, setBalls] = useState([]);
  const [checked, setChecked] = useState(false);
  const [hint, setHint] = useState('');

  // Countdown timer for practice mode
  useEffect(() => {
    if (screen !== 'playing' || mode !== 'practice') return;
    if (timeLeft <= 0) return;
    const t = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) { clearInterval(t); return 0; }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [screen, mode, timeLeft]);

  // When timer hits 0 in practice mode, finish
  useEffect(() => {
    if (screen === 'playing' && mode === 'practice' && timeLeft === 0) {
      playWhistleSound();
      setTimeout(() => setScreen('finished'), 600);
    }
  }, [timeLeft, screen, mode]);

  const newProblem = useCallback((op) => {
    setProblem(generateProblem(op));
    setFeedback(''); setFeedbackType(''); setChecked(false); setHint('');
  }, []);

  const switchOp = (op) => { setOperation(op); newProblem(op); };

  const startGame = () => {
    setScore(0); setStreak(0); setBestStreak(0); setAttempts(0);
    setFeedback(''); setFeedbackType(''); setChecked(false); setHint('');
    setProblem(generateProblem(operation));
    if (mode === 'practice') setTimeLeft(practiceMins * 60);
    setScreen('playing');
  };

  const goToMenu = () => { setScreen('menu'); };

  const celebrateGoal = (newScore) => {
    playGoalSound();
    setShowGoal(true);
    const nb = Array.from({length:12},(_,i)=>({id:Date.now()+i,left:Math.random()*100,delay:Math.random()*0.8}));
    setBalls(nb);
    setTimeout(() => {
      setShowGoal(false); setBalls([]);
      if (mode === 'match' && newScore >= MATCH_GOALS) { playWhistleSound(); setScreen('finished'); }
    }, 2000);
  };

  const handleCorrect = () => {
    const ns = score + 1; const nst = streak + 1;
    setScore(ns); setStreak(nst);
    setBestStreak(b => Math.max(b, nst));
    setAttempts(a => a + 1);
    celebrateGoal(ns);
  };

  const handleIncorrect = () => { playMissSound(); setStreak(0); setAttempts(a => a + 1); };

  // ─── Menu screen ───
  if (screen === 'menu') {
    return (
      <>
        <div className="header">
          <h1>⚽ <span>MATTE</span>MATCHEN</h1>
          <div className="subtitle">Träna matte och gör mål!</div>
        </div>
        <div className="menu-card">
          <h2>Välj spelläge</h2>
          <button className={`mode-btn ${mode==='match'?'selected':''}`} onClick={()=>setMode('match')}>
            🏆 Match
            <span className="mode-desc">Gör {MATCH_GOALS} mål för att vinna!</span>
          </button>
          <button className={`mode-btn ${mode==='practice'?'selected':''}`} onClick={()=>setMode('practice')}>
            ⏱ Träning
            <span className="mode-desc">Öva på tid — hur många mål hinner du?</span>
          </button>

          {mode === 'practice' && (
            <div className="timer-picker">
              <label>⏱ Tid:</label>
              <select value={practiceMins} onChange={e => setPracticeMins(Number(e.target.value))}>
                {[1,2,3,5,10,15,20].map(m => (
                  <option key={m} value={m}>{m} min</option>
                ))}
              </select>
            </div>
          )}

          <button className="btn-start" onClick={startGame}>⚽ Starta!</button>
        </div>
      </>
    );
  }

  // ─── Finished screen ───
  if (screen === 'finished') {
    return (
      <>
        <div className="header">
          <h1>⚽ <span>MATTE</span>MATCHEN</h1>
        </div>
        <div className="match-finished-overlay" style={{position:'relative', background:'transparent', backdropFilter:'none', minHeight:'60vh'}}>
          <div className="match-finished-card">
            <div className="trophy">{mode === 'match' ? '🏆' : '⏱'}</div>
            <h2>{mode === 'match' ? 'Matchen är slut!' : 'Tiden är ute!'}</h2>
            <div className="stats">
              Du gjorde <span>{score} mål</span> på <span>{attempts} försök</span>!<br/>
              Bästa svit: <span>🔥 {bestStreak}</span>
            </div>
            <button className="btn-restart" onClick={startGame}>
              {mode === 'match' ? '⚽ Ny match!' : '⚽ Träna igen!'}
            </button>
            <br/>
            <button className="btn-menu" onClick={goToMenu}>↩️ Tillbaka</button>
          </div>
        </div>
      </>
    );
  }

  // ─── Playing screen ───
  return (
    <>
      <div className="header">
        <h1>⚽ <span>MATTE</span>MATCHEN</h1>
        <div className="subtitle">{mode === 'match' ? `Gör ${MATCH_GOALS} mål för att vinna!` : 'Träningspass'}</div>
      </div>

      <div className="scoreboard">
        <div className="score-item">
          <div className="score-label">Mål</div>
          <div className="score-value">{mode === 'match' ? `${score}/${MATCH_GOALS}` : score}</div>
        </div>
        <div className="score-divider"></div>
        <div className="score-item">
          <div className="score-label">Försök</div>
          <div className="score-value">{attempts}</div>
        </div>
        <div className="score-divider"></div>
        <div className="score-item">
          <div className="score-label">Svit</div>
          <div className="score-value streak">🔥 {streak}</div>
        </div>
        <div className="score-divider"></div>
        {mode === 'match' ? (
          <div className="score-item">
            <div className="goal-progress">
              {Array.from({length:MATCH_GOALS},(_,i) => (
                <div key={i} className={`goal-dot ${i<score?'scored':''}`}></div>
              ))}
            </div>
          </div>
        ) : (
          <div className="score-item">
            <div className="score-label">Tid</div>
            <div className={`score-value timer-val ${timeLeft <= 30 ? 'urgent' : ''}`}>
              ⏱ {fmtTimer(timeLeft)}
            </div>
          </div>
        )}
      </div>

      <div className="op-selector">
        {['+','\u2212','\u00d7','\u221a'].map(op => (
          <button key={op} className={`op-btn ${operation===op?'active':''}`} onClick={()=>switchOp(op)}>
            {op==='+'?'➕ Plus':op==='\u2212'?'➖ Minus':op==='\u00d7'?'✖️ Gånger':'√ Roten'}
          </button>
        ))}
      </div>

      <div className="problem-card">
        {operation === '\u00d7' ? (
          <MultiplicationWorkspace problem={problem} checked={checked} setChecked={setChecked}
            setFeedback={setFeedback} setFeedbackType={setFeedbackType}
            onCorrect={handleCorrect} onIncorrect={handleIncorrect} />
        ) : operation === '\u221a' ? (
          <SqrtWorkspace problem={problem} checked={checked} setChecked={setChecked}
            setFeedback={setFeedback} setFeedbackType={setFeedbackType}
            onCorrect={handleCorrect} onIncorrect={handleIncorrect} />
        ) : (
          <AddSubWorkspace problem={problem} checked={checked} setChecked={setChecked}
            setFeedback={setFeedback} setFeedbackType={setFeedbackType}
            onCorrect={handleCorrect} onIncorrect={handleIncorrect} />
        )}
        <div className="btn-row">
          {!checked && (
            <button className="btn btn-hint" onClick={() => {
              if (operation==='\u00d7') setHint('Multiplicera med en siffra i taget! Börja med entalen. Minnessiffra när produkten blir 10 eller mer.');
              else if (operation==='\u2212') setHint('Börja från höger. Om övre siffran är mindre, klicka på den för att låna! Siffran till vänster stryks och du får +10.');
              else if (operation==='\u221a') setHint('Vilket tal multiplicerat med sig självt ger talet under rottecknet? T.ex. √25 = 5 eftersom 5 × 5 = 25.');
              else setHint('Börja från höger. Addera siffrorna plus minnessiffra. Om summan blir 10+, skriv entalet och för över minnessiffran.');
            }}>💡 Tips</button>
          )}
          <button className="btn btn-new" onClick={() => newProblem(operation)}>⚽ Nytt tal</button>
        </div>
        {feedback && <div className={`feedback ${feedbackType}`}>{feedback}</div>}
        {hint && <div className="hint-box"><div className="hint-title">💡 Tränarens tips</div>{hint}</div>}
      </div>

      <div className={`goal-overlay ${showGoal?'show':''}`}>
        {showGoal && <div className="goal-text">⚽ MÅÅÅL!!</div>}
      </div>
      {balls.map(b => (
        <div key={b.id} className="ball-rain" style={{left:b.left+'%',animationDelay:b.delay+'s'}}>⚽</div>
      ))}
    </>
  );
}


// ─── Addition / Subtraction Workspace ───────────────────
function AddSubWorkspace({ problem, checked, setChecked, setFeedback, setFeedbackType, onCorrect, onIncorrect }) {
  const { a, b, op, answer } = problem;
  const isSub = (op === '\u2212');
  const maxLen = Math.max(String(a).length, String(b).length, String(answer).length);
  const totalCols = maxLen + 1;
  const aOrig = digitsArr(a, totalCols);
  const bDig = digitsArr(b, totalCols);
  const ansDig = digitsArr(answer, totalCols);

  const [ansIn, setAnsIn] = useState({});
  const [carryIn, setCarryIn] = useState({});
  const [status, setStatus] = useState({});
  const [bGiven, setBGiven] = useState({});
  const [bRecv, setBRecv] = useState({});
  const refs = useRef({});

  useEffect(() => {
    setAnsIn({}); setCarryIn({}); setStatus({}); setBGiven({}); setBRecv({}); refs.current = {};
  }, [problem]);

  const effDig = (c) => {
    const o = aOrig[c]; if (o===null) return null;
    return o - (bGiven[c]||0) + (bRecv[c]||0)*10;
  };

  const doBorrow = (c) => {
    if (checked || !isSub || c < 1) return;
    const le = effDig(c-1); if (le===null||le<=0) return;
    setBGiven(p=>({...p,[c-1]:(p[c-1]||0)+1}));
    setBRecv(p=>({...p,[c]:(p[c]||0)+1}));
  };

  const onAns = (c,v) => {
    if (v.length>1) v=v.slice(-1); if (v&&!/^\d$/.test(v)) return;
    setAnsIn(p=>({...p,[c]:v}));
    if (v&&c>0) { const r=refs.current['a-'+(c-1)]; if(r) setTimeout(()=>r.focus(),50); }
  };
  const onCarry = (c,v) => {
    if (v.length>1) v=v.slice(-1); if (v&&!/^\d$/.test(v)) return;
    setCarryIn(p=>({...p,[c]:v}));
  };

  const doCheck = () => {
    let ed=[]; for(let c=0;c<totalCols;c++) ed.push(ansIn[c]||'');
    const es = ed.join('').replace(/^0+/,'')||'0';
    const ns = {};
    for(let c=0;c<totalCols;c++){
      const ex=ansDig[c], en=ansIn[c]||'';
      if(ex===null&&en===''){}
      else if(String(ex)===en) ns[c]='correct';
      else ns[c]='incorrect';
    }
    setStatus(ns); setChecked(true);
    if(es===String(answer)){
      setFeedback('⚽ MÅÅÅL! Snyggt jobbat!'); setFeedbackType('goal'); onCorrect();
    } else {
      setFeedback(`Inte riktigt! Svaret är ${answer}.`); setFeedbackType('miss'); onIncorrect();
    }
  };

  const hasBorrow = Object.keys(bGiven).length>0;

  return (
    <div className="workspace">
      <div className="problem-question">Vad är {a} {op} {b}?</div>
      {!isSub && (
        <div className="carry-row">
          <div className="carry-cell" style={{width:'var(--cell-size)'}}></div>
          {Array.from({length:totalCols},(_,c)=>(
            <div className="carry-cell" key={'c-'+c}>
              <input className={`carry-input ${carryIn[c]?'has-value':''}`}
                type="text" inputMode="numeric" maxLength={1}
                value={carryIn[c]||''} onChange={e=>onCarry(c,e.target.value)} disabled={checked}/>
            </div>
          ))}
        </div>
      )}
      {isSub && !checked && <div className="borrow-help-text">👆 Klicka på en siffra för att låna</div>}
      <div className="grid-row">
        <div className="op-symbol"></div>
        {aOrig.map((d,c)=>{
          if(!isSub) return <div className="cell cell-digit" key={'a-'+c}>{d!==null?d:''}</div>;
          const gv=bGiven[c]||0, rv=bRecv[c]||0;
          const canB=!checked&&d!==null&&c>0;
          return (
            <div className={`borrow-digit-cell ${(!canB||checked)?'no-click':''}`} key={'a-'+c}
              onClick={()=>canB&&doBorrow(c)}>
              {rv>0&&<span className="borrow-ten-marker">10</span>}
              <span className={`borrow-digit-main ${gv>0?'crossed-out':''}`}>{d!==null?d:''}</span>
            </div>
          );
        })}
      </div>
      <div className="grid-row">
        <div className="op-symbol">{op}</div>
        {bDig.map((d,c)=><div className="cell cell-digit" key={'b-'+c}>{d!==null?d:''}</div>)}
      </div>
      <div className="separator"><div className="sep-line" style={{width:'calc(var(--cell-size) * '+(totalCols+1)+')'}}></div></div>
      <div className="grid-row">
        <div className="op-symbol"></div>
        {Array.from({length:totalCols},(_,c)=>(
          <div className="cell" key={'r-'+c}>
            <input ref={el=>refs.current['a-'+c]=el}
              className={`cell-input ${status[c]||''}`}
              type="text" inputMode="numeric" maxLength={1}
              value={ansIn[c]||''} onChange={e=>onAns(c,e.target.value)} disabled={checked}/>
          </div>
        ))}
      </div>
      {!checked&&(
        <div className="btn-row" style={{marginTop:10}}>
          <button className="btn btn-check" onClick={doCheck}>✅ Kolla svar</button>
          {isSub&&hasBorrow&&<button className="btn btn-undo" onClick={()=>{setBGiven({});setBRecv({});}}>↩️ Ångra</button>}
        </div>
      )}
    </div>
  );
}


// ─── Multiplication Workspace ───────────────────────────
function MultiplicationWorkspace({ problem, checked, setChecked, setFeedback, setFeedbackType, onCorrect, onIncorrect }) {
  const { a, b, answer } = problem;
  const bDA = String(b).split('').map(Number);
  const pp = bDA.map((d,i)=>a*d*Math.pow(10,bDA.length-1-i));
  const mpLen = Math.max(...pp.map(p=>String(p).length));
  const maxLen = Math.max(String(a).length, String(b).length, String(answer).length, mpLen);
  const tc = maxLen+1;
  const aD = digitsArr(a,tc), bP = digitsArr(b,tc);

  const [pIn,setPIn]=useState({}); const [fIn,setFIn]=useState({});
  const [cIn,setCIn]=useState({}); const [st,setSt]=useState({});
  const refs=useRef({});

  useEffect(()=>{ setPIn({}); setFIn({}); setCIn({}); setSt({}); refs.current={}; },[problem]);

  const onP=(r,c,v)=>{
    if(v.length>1)v=v.slice(-1); if(v&&!/^\d$/.test(v))return;
    setPIn(p=>({...p,[r+'-'+c]:v}));
    if(v&&c>0){const x=refs.current['p-'+r+'-'+(c-1)];if(x)setTimeout(()=>x.focus(),50);}
  };
  const onF=(c,v)=>{
    if(v.length>1)v=v.slice(-1); if(v&&!/^\d$/.test(v))return;
    setFIn(p=>({...p,[c]:v}));
    if(v&&c>0){const x=refs.current['f-'+(c-1)];if(x)setTimeout(()=>x.focus(),50);}
  };
  const onC=(r,c,v)=>{
    if(v.length>1)v=v.slice(-1); if(v&&!/^\d$/.test(v))return;
    setCIn(p=>({...p,['c-'+r+'-'+c]:v}));
  };

  const doCheck=(fi)=>{
    const aD2=digitsArr(answer,tc);
    let ed=[]; for(let c=0;c<tc;c++) ed.push(fi[c]||'');
    const es=ed.join('').replace(/^0+/,'')||'0';
    const ns={};
    for(let c=0;c<tc;c++){
      const ex=aD2[c],en=fi[c]||'';
      if(ex===null&&en===''){}
      else if(String(ex)===en) ns['f-'+c]='correct';
      else ns['f-'+c]='incorrect';
    }
    pp.forEach((v,r)=>{
      const pd=digitsArr(v,tc);
      for(let c=0;c<tc;c++){
        const ex=pd[c],en=pIn[r+'-'+c]||'';
        if(ex===null&&en===''){}
        else if(String(ex)===en) ns['p-'+r+'-'+c]='correct';
        else if(en!=='') ns['p-'+r+'-'+c]='incorrect';
      }
    });
    setSt(ns); setChecked(true);
    if(es===String(answer)){
      setFeedback('⚽ MÅÅÅL! Briljant!'); setFeedbackType('goal'); onCorrect();
    } else {
      setFeedback(`Nästan! Svaret är ${answer}.`); setFeedbackType('miss'); onIncorrect();
    }
  };

  const handleCheck=()=>{
    if(pp.length===1){
      const fi={}; for(let c=0;c<tc;c++) fi[c]=pIn['0-'+c]||'';
      setFIn(fi);
      const aD2=digitsArr(answer,tc);
      let ed=[]; for(let c=0;c<tc;c++) ed.push(fi[c]||'');
      const es=ed.join('').replace(/^0+/,'')||'0';
      const ns={};
      for(let c=0;c<tc;c++){
        const ex=aD2[c],en=fi[c]||'';
        if(ex===null&&en===''){}
        else if(String(ex)===en) ns['p-0-'+c]='correct';
        else ns['p-0-'+c]='incorrect';
      }
      setSt(ns); setChecked(true);
      if(es===String(answer)){
        setFeedback('⚽ MÅÅÅL! Briljant!'); setFeedbackType('goal'); onCorrect();
      } else {
        setFeedback(`Nästan! Svaret är ${answer}.`); setFeedbackType('miss'); onIncorrect();
      }
    } else doCheck(fIn);
  };

  return (
    <div className="workspace">
      <div className="problem-question">Vad är {a} × {b}?</div>
      <div className="carry-row">
        <div className="carry-cell" style={{width:'var(--cell-size)'}}></div>
        {Array.from({length:tc},(_,c)=>(
          <div className="carry-cell" key={'ct-'+c}>
            <input className={`carry-input ${cIn['c-top-'+c]?'has-value':''}`}
              type="text" inputMode="numeric" maxLength={1}
              value={cIn['c-top-'+c]||''} onChange={e=>onC('top',c,e.target.value)} disabled={checked}/>
          </div>
        ))}
      </div>
      <div className="grid-row">
        <div className="op-symbol"></div>
        {aD.map((d,c)=><div className="cell cell-digit" key={'a-'+c}>{d!==null?d:''}</div>)}
      </div>
      <div className="grid-row">
        <div className="op-symbol">×</div>
        {bP.map((d,c)=><div className="cell cell-digit" key={'b-'+c}>{d!==null?d:''}</div>)}
      </div>
      <div className="separator"><div className="sep-line" style={{width:'calc(var(--cell-size) * '+(tc+1)+')'}}></div></div>

      {pp.length>1&&(
        <div className="carry-row">
          <div className="carry-cell" style={{width:'var(--cell-size)'}}></div>
          {Array.from({length:tc},(_,c)=>(
            <div className="carry-cell" key={'cs-'+c}>
              <input className={`carry-input ${cIn['c-sum-'+c]?'has-value':''}`}
                type="text" inputMode="numeric" maxLength={1}
                value={cIn['c-sum-'+c]||''} onChange={e=>onC('sum',c,e.target.value)} disabled={checked}/>
            </div>
          ))}
        </div>
      )}

      {pp.map((v,r)=>(
        <div className="grid-row" key={'pp-'+r}>
          <div className="op-symbol" style={{fontSize:'0.9rem',color:'#999'}}>
            {pp.length>1?(r===0?'':'+'):''}
          </div>
          {Array.from({length:tc},(_,c)=>(
            <div className="cell" key={'p-'+r+'-'+c}>
              <input ref={el=>refs.current['p-'+r+'-'+c]=el}
                className={`cell-input ${st['p-'+r+'-'+c]||''}`}
                type="text" inputMode="numeric" maxLength={1}
                value={pIn[r+'-'+c]||''} onChange={e=>onP(r,c,e.target.value)} disabled={checked}/>
            </div>
          ))}
        </div>
      ))}

      {pp.length>1&&(
        <>
          <div className="separator" style={{marginTop:4}}><div className="sep-line" style={{width:'calc(var(--cell-size) * '+(tc+1)+')'}}></div></div>
          <div className="grid-row">
            <div className="op-symbol">=</div>
            {Array.from({length:tc},(_,c)=>(
              <div className="cell" key={'f-'+c}>
                <input ref={el=>refs.current['f-'+c]=el}
                  className={`cell-input ${st['f-'+c]||''}`}
                  type="text" inputMode="numeric" maxLength={1}
                  value={fIn[c]||''} onChange={e=>onF(c,e.target.value)} disabled={checked}/>
              </div>
            ))}
          </div>
        </>
      )}

      {!checked&&(
        <div className="btn-row" style={{marginTop:10}}>
          <button className="btn btn-check" onClick={handleCheck}>✅ Kolla svar</button>
        </div>
      )}
    </div>
  );
}

// ─── Square Root Workspace ──────────────────────────────
function SqrtWorkspace({ problem, checked, setChecked, setFeedback, setFeedbackType, onCorrect, onIncorrect }) {
  const { a, answer } = problem;
  const [userAnswer, setUserAnswer] = useState('');
  const [status, setStatus] = useState('');
  const inputRef = useRef(null);

  useEffect(() => {
    setUserAnswer(''); setStatus('');
    if (inputRef.current) setTimeout(() => inputRef.current.focus(), 100);
  }, [problem]);

  const handleChange = (v) => {
    if (v.length > 2) v = v.slice(-2);
    if (v && !/^\d+$/.test(v)) return;
    setUserAnswer(v);
  };

  const doCheck = () => {
    setChecked(true);
    if (userAnswer === String(answer)) {
      setStatus('correct');
      setFeedback('⚽ MÅÅÅL! Snyggt jobbat!'); setFeedbackType('goal'); onCorrect();
    } else {
      setStatus('incorrect');
      setFeedback(`Inte riktigt! √${a} = ${answer}.`); setFeedbackType('miss'); onIncorrect();
    }
  };

  const handleKey = (e) => { if (e.key === 'Enter' && !checked && userAnswer) doCheck(); };

  return (
    <div className="workspace">
      <div className="problem-question">Vad är roten ur {a}?</div>

      <div className="sqrt-display">
        <div className="sqrt-symbol">√</div>
        <div className="sqrt-radicand-wrap">
          <span className="sqrt-radicand">{a}</span>
        </div>
        <span className="sqrt-equals">=</span>
        <input
          ref={inputRef}
          className={`sqrt-input ${status}`}
          type="text"
          inputMode="numeric"
          maxLength={2}
          value={userAnswer}
          onChange={e => handleChange(e.target.value)}
          onKeyDown={handleKey}
          disabled={checked}
          autoFocus
        />
      </div>

      {!checked && (
        <div className="btn-row" style={{marginTop: 4}}>
          <button className="btn btn-check" onClick={doCheck}>✅ Kolla svar</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
